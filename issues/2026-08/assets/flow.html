<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Genie One MCP flow</title>
<style>
  :root{
    --espresso:#2F4F3E; --leaf:#4E7B61; --pastel:#7DAF8B; --beige:#C8B79A;
    --brown:#A64B2A; --fresh:#8CC665; --mint:#D1E3D1; --ink:#20343f;
  }
  html,body{margin:0;padding:0;background:#F2F7F2;}
  #stage{width:1280px;height:720px;display:block;}
  text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;fill:var(--ink);}
  .lbl{font-size:19px;font-weight:600;}
  .lbl.sub{font-size:15px;font-weight:500;fill:#5c6f66;}
  .hublbl{font-size:26px;font-weight:700;fill:var(--espresso);}
  .ic{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;
      stroke-linecap:round;stroke-linejoin:round;}
  .edge-base{fill:none;stroke:#cdd9cd;stroke-width:3;stroke-linecap:round;}
  .edge-flow{fill:none;stroke:var(--leaf);stroke-width:3.5;stroke-linecap:round;}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="53%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#F2F7F2"/>
    </radialGradient>
    <radialGradient id="cometG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2fff4" stop-opacity="1"/>
      <stop offset="35%" stop-color="#8CC665" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8CC665" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#2F4F3E" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGlow)"/>

  <!-- edges: base (faint) + flow (revealed) -->
  <g id="edges">
    <path id="e1" class="edge-base" d="M640,184 L640,292"></path>
    <path id="e2" class="edge-base" d="M556,360 Q420,300 314,360"></path>
    <path id="e3" class="edge-base" d="M314,404 Q420,462 556,404"></path>
    <path id="e4" class="edge-base" d="M722,348 Q870,250 985,245"></path>
    <path id="e6" class="edge-base" d="M1035,279 Q1000,400 1045,525"></path>

    <path id="e1f" class="edge-flow" d="M640,184 L640,292"></path>
    <path id="e2f" class="edge-flow" d="M556,360 Q420,300 314,360"></path>
    <path id="e3f" class="edge-flow" d="M314,404 Q420,462 556,404"></path>
    <path id="e4f" class="edge-flow" d="M722,348 Q870,250 985,245"></path>
    <path id="e6f" class="edge-flow" d="M1035,279 Q1000,400 1045,525"></path>
  </g>

  <!-- comet -->
  <g id="comet" opacity="0">
    <circle r="19" fill="url(#cometG)" filter="url(#glow)"></circle>
    <circle r="6.5" fill="#f4fff6"></circle>
  </g>

  <!-- NODES -->
  <!-- Weekly job -->
  <g class="node" id="n_job">
    <circle class="glow" cx="640" cy="130" r="60" fill="var(--leaf)" opacity="0" filter="url(#glow)"></circle>
    <circle class="disc" cx="640" cy="130" r="54" fill="#fff" stroke="#d3ddd3" stroke-width="2" filter="url(#softshadow)"></circle>
    <g class="ic" color="var(--espresso)" transform="translate(640,130) scale(1.85) translate(-12,-12)" style="stroke:currentColor">
      <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/><path d="M12 13v3l2 1"/>
    </g>
    <text class="lbl" x="640" y="212" text-anchor="middle">Weekly job runs</text>
  </g>

  <!-- Genie One (hub) -->
  <g class="node" id="n_genie">
    <circle class="glow" cx="640" cy="380" r="98" fill="var(--fresh)" opacity="0" filter="url(#glow)"></circle>
    <circle class="disc" cx="640" cy="380" r="88" fill="var(--espresso)" stroke="#25402f" stroke-width="2" filter="url(#softshadow)"></circle>
    <g class="ic" color="#ffffff" transform="translate(640,362) scale(2.7) translate(-12,-12)" style="stroke:currentColor">
      <path d="M12 3l1.7 4.6L18 9l-4.3 1.4L12 15l-1.7-4.6L6 9l4.3-1.4z"/>
      <path d="M18.5 14l.7 1.9L21 16.5l-1.8.6-.7 1.9-.7-1.9L16 16.5l1.8-.6z"/>
    </g>
    <text class="hublbl" x="640" y="440" text-anchor="middle" fill="#ffffff">Genie One</text>
  </g>

  <!-- Data -->
  <g class="node" id="n_data">
    <circle class="glow" cx="250" cy="382" r="72" fill="var(--leaf)" opacity="0" filter="url(#glow)"></circle>
    <circle class="disc" cx="250" cy="382" r="66" fill="#fff" stroke="#d3ddd3" stroke-width="2" filter="url(#softshadow)"></circle>
    <g class="ic" color="var(--espresso)" transform="translate(250,382) scale(2.2) translate(-12,-12)" style="stroke:currentColor">
      <ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/>
    </g>
    <text class="lbl" x="250" y="470" text-anchor="middle">Structured &amp;</text>
    <text class="lbl" x="250" y="494" text-anchor="middle">unstructured data</text>
  </g>

  <!-- You approve -->
  <g class="node" id="n_approve">
    <circle class="glow" cx="1035" cy="225" r="60" fill="var(--fresh)" opacity="0" filter="url(#glow)"></circle>
    <circle class="disc" cx="1035" cy="225" r="54" fill="#fff" stroke="#d3ddd3" stroke-width="2" filter="url(#softshadow)"></circle>
    <g class="ic" color="var(--espresso)" transform="translate(1035,225) scale(1.9) translate(-12,-12)" style="stroke:currentColor">
      <circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>
    </g>
    <text class="lbl" x="1035" y="307" text-anchor="middle">You approve</text>
  </g>

  <!-- Jira ticket -->
  <g class="node" id="n_jira">
    <circle class="glow" cx="1045" cy="585" r="66" fill="var(--fresh)" opacity="0" filter="url(#glow)"></circle>
    <circle class="disc" cx="1045" cy="585" r="60" fill="#fff" stroke="#d3ddd3" stroke-width="2" filter="url(#softshadow)"></circle>
    <g class="ic" color="var(--espresso)" transform="translate(1045,585) scale(2.05) translate(-12,-12)" style="stroke:currentColor">
      <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h5"/><path d="M13.7 16.3l1.8 1.8 3.2-3.6"/>
    </g>
    <text class="lbl" x="1045" y="672" text-anchor="middle">Jira ticket created</text>
  </g>
</svg>

<script>
  const S = id => document.getElementById(id);
  const clamp = (x,lo,hi)=>Math.max(lo,Math.min(hi,x));
  const smooth = (a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};

  const flowIds = ['e1f','e2f','e3f','e4f','e6f'];
  const lens = {};
  flowIds.forEach(id=>{ const p=S(id); const L=p.getTotalLength();
    lens[id]=L; p.style.strokeDasharray=L; p.style.strokeDashoffset=L; });

  // traveling segments in order, with time windows over t in [0,1]
  const trav = [
    {f:'e1f', a:0.05, b:0.17},
    {f:'e2f', a:0.17, b:0.31},
    {f:'e3f', a:0.31, b:0.45},
    {f:'e4f', a:0.45, b:0.58},
    {f:'e6f', a:0.68, b:0.82},
  ];

  function setNode(name, prog){
    const g = S('n_'+name);
    g.setAttribute('opacity', (0.34 + 0.66*prog).toFixed(3));
    g.querySelector('.glow').setAttribute('opacity', (0.85*prog).toFixed(3));
    if(name!=='genie'){
      const disc=g.querySelector('.disc');
      disc.setAttribute('stroke', prog>0.55 ? getCSS('--leaf') : '#d3ddd3');
    }
  }
  function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

  function jiraSuccess(on){
    const g=S('n_jira'); const disc=g.querySelector('.disc'); const ic=g.querySelector('.ic');
    disc.setAttribute('fill', on?getCSS('--fresh'):'#fff');
    disc.setAttribute('stroke', on?getCSS('--fresh'):'#d3ddd3');
    ic.setAttribute('color', getCSS('--espresso'));
  }

  window.seek = function(t){
    t = t % 1;
    const fade = smooth(0.93,1.0,t);
    const g = 1 - fade;

    setNode('job',    smooth(0.05,0.13,t)*g);
    setNode('genie',  Math.min(1, 0.55 + 0.45*smooth(0.05,0.17,t))*g);
    setNode('data',   smooth(0.24,0.31,t)*g);
    setNode('approve',smooth(0.51,0.58,t)*g);
    const jiraP = smooth(0.75,0.82,t)*g;
    setNode('jira', jiraP);
    jiraSuccess(jiraP>0.5);

    // hub breathing glow
    const hb = (t>0.05? (0.35+0.25*Math.sin(t*Math.PI*2*2)) : 0.2)*g;
    S('n_genie').querySelector('.glow').setAttribute('opacity', clamp(hb,0,0.9).toFixed(3));
    // approve accept pulse (beat 0.58-0.68)
    if(t>0.58 && t<0.68){
      const beat = Math.sin((t-0.58)/0.10*Math.PI);
      S('n_approve').querySelector('.glow').setAttribute('opacity', (0.85*g*Math.max(beat, (t>0.58?0.6:0))).toFixed(3));
    }

    // edges reveal + comet
    let cometShown = false;
    for(const e of trav){
      const p = smooth(e.a, e.b, t);          // eased 0..1 within its window
      const L = lens[e.f];
      S(e.f).style.strokeDashoffset = (L*(1-p)).toFixed(2);
      S(e.f).style.opacity = g.toFixed(3);
      if(!cometShown && t>=e.a && t<e.b){
        const pt = S(e.f).getPointAtLength(p*L);
        const c = S('comet');
        c.setAttribute('transform', `translate(${pt.x.toFixed(2)},${pt.y.toFixed(2)})`);
        c.setAttribute('opacity', g.toFixed(3));
        cometShown = true;
      }
    }
    if(!cometShown) S('comet').setAttribute('opacity','0');
    return true;
  };

  // preview playback when opened directly; static frame with ?t=
  const q = new URLSearchParams(location.search);
  if(q.has('t')){ window.seek(parseFloat(q.get('t'))); }
  else {
    const DUR = 6000;
    let t0=null;
    function loop(ts){ if(!t0)t0=ts; window.seek(((ts-t0)%DUR)/DUR); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
